name: Build wheels manually
on:
  workflow_dispatch

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build
        run: python -m pip install build

      - name: Build sdist only
        run: python -m build -s

      - uses: actions/upload-artifact@v7
        with:
          name: numina-sdist
          path: ./dist/numina*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: cp311-* cp312-* cp313-* cp314-* cp315-*
          # macos-latest runs on arm64, the x86_64 wheels are cross-compiled
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_SKIP: '*_i686'

      - uses: actions/upload-artifact@v7
        with:
          name: numina-wheels-${{ matrix.os }}
          path: ./wheelhouse/numina*.whl
