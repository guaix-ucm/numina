
[numina]


[tool.run]
# Options for run subcommand
# Templates of the names of directories and files, used with
# format 1 of the control file. Valid fields are {obsid} and {taskid}
workdir_tmpl: obsid{obsid}_work
resultdir_tmpl: obsid{obsid}_results
resultfile_tmpl: result.json
taskfile_tmpl: task.json
datadir: data

copy_files: False
validate: False

[tool.db]
# Registry of the reductions, used by numina run if file is defined
# (or with numina run --db FILE). The path is relative to basedir.
# file: numina-db.json
#
# With the registry, the templates of [tool.run] defined here are
# replaced by these, so that each task has its own directories.
# Changing the templates in [tool.run] has no effect on these
workdir_tmpl: obsid{obsid}_{taskid}_work
resultdir_tmpl: obsid{obsid}_{taskid}_results
