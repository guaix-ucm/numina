[tox]
envlist =
	py{311, 312, 313, 314, 315}
	docs
	codestyle
isolated_build = True

[testenv]
changedir={envdir}
description =
    test build
extras =
    test
deps =
    pytest
commands = pytest {tox_root}/tests {posargs}

[testenv:docs]
changedir = doc
description = build docs
extras =
    docs
commands = sphinx-build -W -b html -d {envtmpdir}/doctrees . {envtmpdir}/html

[testenv:codestyle]
changedir = src
description = check code style with flake8
skip_install = true
deps = flake8
commands = flake8 numina --count

[testenv:coverage]
description = test coverage, fails below fail_under of pyproject.toml
extras = test
deps = coverage
setenv =
    COVERAGE_RCFILE = {tox_root}/pyproject.toml
commands =
    coverage run -m pytest {tox_root}/tests --runslow
    coverage html --directory {tox_root}/htmlcov
    coverage report

[testenv:typecheck]
description = check calls, imports and names with basedpyright, not in envlist, run it before a release
changedir = {tox_root}
deps = basedpyright
commands = basedpyright {posargs}
